name: Job - OpenAPI SDK Generation
on:
  workflow_call:
    inputs:
      docker_target:
        required: true
        type: string
      publish_to_pypi:
        required: false
        type: boolean
        default: false
      version_suffix:
        required: false
        type: string
        default: ""
    secrets:
      pypi_token:
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: python
            pkg_prefix: "gdariodev"
            output_dir: "./gen/python"
            dist_dir: "./gen/python/dist/"
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      
      - name: Export Spec from Docker
        run: docker build --target ${{ inputs.docker_target }} --output type=local,dest=. .

      - name: Calculate Spec Hash
        id: spec-hash
        shell: bash
        run: |
          HASH=$(sha256sum swagger.json | cut -d ' ' -f 1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Current spec hash: $HASH"

      - name: Restore Last Successful Spec Hash
        id: cache-hash
        uses: actions/cache/restore@v5
        with:
          path: .last_spec_hash
          key: spec-hash-${{ steps.spec-hash.outputs.hash }}

      - name: Check if Spec Changed
        id: check-change
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
             echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -f .last_spec_hash ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.spec-hash.outputs.hash }}" > .last_spec_hash
          fi

      # --- Python Build & Publish ---
      
      - name: Generate Python SDK
        if: steps.check-change.outputs.changed == 'true' && matrix.lang == 'python'
        uses: openapi-generators/openapitools-generator-action@v1
        with:
          generator: python
          openapi-file: swagger.json
          command-args: >
            --package-name gdariodev_${{ github.event.repository.name }}
            -o ${{ matrix.output_dir }}
            --additional-properties=packageName=gdariodev_${{ github.event.repository.name }},projectName=gdariodev-${{ github.event.repository.name }},packageVersion=0.0.${{ github.run_number }}${{ inputs.version_suffix }},gitUserId=${{ github.repository_owner }},gitRepoId=${{ github.event.repository.name }},git_user_id=${{ github.repository_owner }},git_repo_id=${{ github.event.repository.name }},packageUrl=https://github.com/${{ github.repository }},projectUrl=https://github.com/${{ github.repository }},httpUserAccount=${{ github.repository_owner }},httpProjectId=${{ github.event.repository.name }}

      - name: Install Build Tools (Python)
        if: steps.check-change.outputs.changed == 'true' && matrix.lang == 'python'
        shell: bash
        run: pip install build

      - name: Build Package (Python)
        if: steps.check-change.outputs.changed == 'true' && matrix.lang == 'python'
        shell: bash
        run: |
          cd ${{ matrix.output_dir }}
          python -m build

      - name: Publish to PyPI (Python / API Token)
        if: steps.check-change.outputs.changed == 'true' && matrix.lang == 'python' && inputs.publish_to_pypi == true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.dist_dir }}
          password: ${{ secrets.pypi_token }}

      - name: Upload Python SDK Artifact
        if: steps.check-change.outputs.changed == 'true' && matrix.lang == 'python'
        uses: actions/upload-artifact@v7
        with:
          name: sdk-python-0.0.${{ github.run_number }}${{ inputs.version_suffix }}
          path: ${{ matrix.output_dir }}

      # --- Save Hash on Success (Trunk only) ---

      - name: Save New Spec Hash
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.check-change.outputs.changed == 'true' && success()
        uses: actions/cache/save@v5
        with:
          path: .last_spec_hash
          key: spec-hash-${{ steps.spec-hash.outputs.hash }}

