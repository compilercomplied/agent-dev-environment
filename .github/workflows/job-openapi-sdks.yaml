name: Job - OpenAPI SDK Generation
on:
  workflow_call:
    inputs:
      docker_target:
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: python
            pkg_prefix: "gdariodev"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      
      - name: Export Spec from Docker
        run: docker build --target ${{ inputs.docker_target }} --output type=local,dest=. .

      - name: Calculate Spec Hash
        id: spec-hash
        shell: bash
        run: |
          HASH=$(sha256sum swagger.json | cut -d ' ' -f 1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Current spec hash: $HASH"

      - name: Restore Last Successful Spec Hash
        id: cache-hash
        uses: actions/cache/restore@v4
        with:
          path: .last_spec_hash
          key: spec-hash-${{ steps.spec-hash.outputs.hash }}

      - name: Check if Spec Changed
        id: check-change
        shell: bash
        run: |
          if [ -f .last_spec_hash ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "API Spec has not changed. Skipping SDK generation."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "API Spec changed. Proceeding with SDK generation."
            echo "${{ steps.spec-hash.outputs.hash }}" > .last_spec_hash
          fi

      # --- Modular Language Dispatch ---
      
      - name: Process Python SDK
        if: steps.check-change.outputs.changed == 'true' && matrix.lang == 'python'
        uses: ./.github/workflows/openapi-sdks/actions/python
        with:
          package_name: ${{ matrix.pkg_prefix }}-${{ github.event.repository.name }}
          package_version: 1.0.${{ github.run_number }}

      # --- Save Hash on Success ---

      - name: Save New Spec Hash
        if: steps.check-change.outputs.changed == 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .last_spec_hash
          key: spec-hash-${{ steps.spec-hash.outputs.hash }}
