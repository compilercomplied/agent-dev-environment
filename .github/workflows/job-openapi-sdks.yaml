name: Job - OpenAPI SDK Generation
on:
  workflow_call:
    inputs:
      docker_target:
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: python
            pkg_prefix: "gdariodev"
            output_dir: "./gen/python"
            dist_dir: "./gen/python/dist/"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      
      - name: Export Spec from Docker
        run: docker build --target ${{ inputs.docker_target }} --output type=local,dest=. .

      - name: Calculate Spec Hash
        id: spec-hash
        run: |
          HASH=$(sha256sum swagger.json | cut -d ' ' -f 1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Current spec hash: $HASH"

      - name: Restore Last Successful Spec Hash
        id: cache-hash
        uses: actions/cache/restore@v4
        with:
          path: .last_spec_hash
          key: spec-hash-${{ steps.spec-hash.outputs.hash }}

      - name: Check if Spec Changed
        id: check-change
        run: |
          if [ -f .last_spec_hash ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "API Spec has not changed. Skipping SDK generation."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "API Spec changed. Proceeding with SDK generation."
            echo "${{ steps.spec-hash.outputs.hash }}" > .last_spec_hash
          fi

      # --- Python Build (Matrix-aware) ---
      
      - name: Generate Python SDK
        if: steps.check-change.outputs.changed == 'true' && matrix.lang == 'python'
        uses: openapi-generators/openapitools-generator-action@v1
        with:
          generator: python
          openapi-file: swagger.json
          command-args: >
            --package-name ${{ matrix.pkg_prefix }}-${{ github.event.repository.name }}
            -o ${{ matrix.output_dir }}
            --additional-properties=packageName=${{ matrix.pkg_prefix }}-${{ github.event.repository.name }},packageVersion=1.0.${{ github.run_number }}

      - name: Install Build Tools (Python)
        if: steps.check-change.outputs.changed == 'true' && matrix.lang == 'python'
        shell: bash
        run: pip install build

      - name: Build Package (Python)
        if: steps.check-change.outputs.changed == 'true' && matrix.lang == 'python'
        shell: bash
        run: |
          cd ${{ matrix.output_dir }}
          python -m build

      - name: Publish to PyPI (Python / OIDC)
        if: steps.check-change.outputs.changed == 'true' && matrix.lang == 'python'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.dist_dir }}

      # --- Artifact Upload ---

      - name: Upload SDK Artifact
        if: steps.check-change.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.lang }}
          path: ${{ matrix.output_dir }}

      # --- Save Hash on Success ---

      - name: Save New Spec Hash
        if: steps.check-change.outputs.changed == 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .last_spec_hash
          key: spec-hash-${{ steps.spec-hash.outputs.hash }}
