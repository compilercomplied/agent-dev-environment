name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  # 1. PRE-SETUP: Define semantic conditions
  pre-setup:
    runs-on: ubuntu-latest
    outputs:
      is_commit_on_trunk: ${{ steps.check-trunk.outputs.is_trunk }}
    steps:
      - name: Check if on trunk
        id: check-trunk
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "is_trunk=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_trunk=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pipeline started
        shell: bash
        run: |
          echo "Initializing pipeline for ${{ github.ref }} via ${{ github.event_name }}"
          echo "Is trunk: ${{ steps.check-trunk.outputs.is_trunk }}"

  # 2. QA: Run E2E tests
  qa:
    needs: pre-setup
    uses: ./.github/workflows/job-qa.yaml
    secrets: inherit

  # 3. OPENAPI-SDKS: Generate OpenAPI and SDKs (Only on trunk)
  openapi-sdks:
    needs: [pre-setup, qa]
    if: needs.pre-setup.outputs.is_commit_on_trunk == 'true'
    uses: ./.github/workflows/job-openapi-sdks.yaml
    with:
      docker_target: "openapi-spec"

  # 4. DEPLOY: Launch deployment
  deploy:
    needs: [pre-setup, openapi-sdks]
    if: needs.pre-setup.outputs.is_commit_on_trunk == 'true'
    uses: ./.github/workflows/job-deploy.yaml
    secrets: inherit
